# :80 -> admin dashboard (Flutter web), :81 -> buyer storefront (Flutter web build of apps/mobile)
server {
    listen 80;
    root /usr/share/nginx/html/admin;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 81;
    root /usr/share/nginx/html/store;
    location / { try_files $uri $uri/ /index.html; }
}
