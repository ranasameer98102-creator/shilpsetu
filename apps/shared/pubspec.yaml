name: shilpsetu_core
description: Shared design system, API client and widgets for the ShilpSetu apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: fonts/Lora-Regular.ttf
        - asset: fonts/Lora-Italic.ttf
          style: italic
    - family: NotoSansDevanagari
      fonts: [{asset: fonts/NotoSansDevanagari.ttf}]
    - family: NotoSansBengali
      fonts: [{asset: fonts/NotoSansBengali.ttf}]
    - family: NotoSansTamil
      fonts: [{asset: fonts/NotoSansTamil.ttf}]
    - family: NotoSansTelugu
      fonts: [{asset: fonts/NotoSansTelugu.ttf}]
    - family: NotoSansGujarati
      fonts: [{asset: fonts/NotoSansGujarati.ttf}]
    - family: NotoSansGurmukhi
      fonts: [{asset: fonts/NotoSansGurmukhi.ttf}]
    - family: NotoSansKannada
      fonts: [{asset: fonts/NotoSansKannada.ttf}]
    - family: NotoSansMalayalam
      fonts: [{asset: fonts/NotoSansMalayalam.ttf}]
    - family: NotoSansOriya
      fonts: [{asset: fonts/NotoSansOriya.ttf}]
    - family: NotoSansOlChiki
      fonts: [{asset: fonts/NotoSansOlChiki.ttf}]
    - family: NotoNastaliqUrdu
      fonts: [{asset: fonts/NotoNastaliqUrdu.ttf}]
